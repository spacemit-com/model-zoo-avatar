[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spacemit-feathertalk"
dynamic = ["version"]
description = "C++ UNet and FeatherHuBERT inference with process-isolated Python examples"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.26", "PyYAML>=6"]

[project.optional-dependencies]
download = ["zstandard>=0.22"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests/python"]
