name: Avatar SDK checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - name: Check Bash syntax
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n
      - run: bash tests/run_sdk_test.sh python

  native-sdk-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ORT_ARCHIVE: onnxruntime-linux-x64-1.24.2.tgz
      ORT_SHA256: 43725474ba5663642e17684717946693850e2005efbd724ac72da278fead25e6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopencv-core-dev libopencv-imgproc-dev libopencv-imgcodecs-dev \
            libyaml-cpp-dev python3-dev python3-yaml pybind11-dev
      - name: Prepare ONNX Runtime
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/microsoft/onnxruntime/releases/download/v1.24.2/$ORT_ARCHIVE" \
            -o "$ORT_ARCHIVE"
          printf '%s  %s\n' "$ORT_SHA256" "$ORT_ARCHIVE" | sha256sum --check -
          tar -xzf "$ORT_ARCHIVE"
          printf 'ONNXRUNTIME_INCLUDE_DIR=%s/%s/include\n' "$PWD" "${ORT_ARCHIVE%.tgz}" >> "$GITHUB_ENV"
      - run: bash tests/run_sdk_test.sh core
      - run: bash tests/run_sdk_test.sh config
      - run: bash tests/run_sdk_test.sh invalid-input
      - run: bash tests/run_sdk_test.sh installed
