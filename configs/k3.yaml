schema: 1
# Core allocation mirrors the bianbu-avatar k3-long-dialogue-v1 profile:
# FeatherHuBERT runs on CPU with four threads on X100 0-7. The UNet worker
# process stays on X100 0-7, which also hosts the four ORT CPU fallback threads
# for nodes the EP declines, and its two SpaceMIT EP threads run on A100 12,13.
# The default bianbu-avatar profile uses A100 10,11 instead. Keep ep_threads
# equal to the number of ep_affinity cores.
# ep_affinity alone does not confine the EP: outside a restricted cgroup the EP
# starts one worker per A100 core and computes on the first ones. Run the
# worker in a cgroup that allows only X100 0-7 plus the selected A100 cores, as
# the bianbu-avatar systemd unit does:
#   systemd-run --scope -p AllowedCPUs=0-7,12-13 avatar_worker ...
# Measured on K3 with the EP 2.0.7 runtime bundled by bianbu-avatar. System EP
# 2.0.8 still started workers on excluded A100 cores inside such a cgroup.
# Provider selection alone does not prove full Resize coverage. System 2.0.8
# showed four CPU Resize events on the tested board. Select a validated closure
# explicitly when requiring all-EP UNet, then run scripts/verify_ep_profile.py.
hubert:
  model: ~/.cache/models/avatar/feather_hubert_dynamic.onnx
  provider: cpu
  ort_library: libonnxruntime.so
  threads: 4
  cpu_affinity: [0, 1, 2, 3, 4, 5, 6, 7]
unet:
  model: ~/.cache/models/avatar/feifan_int8.onnx
  provider: spacemit
  ort_library: libonnxruntime.so
  ep_library: libspacemit_ep.so
  threads: 4
  cpu_affinity: [0, 1, 2, 3, 4, 5, 6, 7]
  ep_threads: 2
  ep_affinity: "12;13"
assets:
  person: ~/.cache/assets/avatar/feifan
render:
  feather: true
  native_pasteback: true
  mouth_only_blend: false
